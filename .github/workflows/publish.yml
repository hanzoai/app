# Publishes each package this repository holds — @hanzo/mod (pkg/mod) and
# @hanzo/app (pkg/app), in that order, because the app depends on the contract —
# when its package.json names a version npm does not serve yet. hanzo.ai,
# hanzo.team, pay and Hanzo Desktop take them from npm.
#
# The question is asked of the registry, not of the diff: a version strictly
# greater than npm's `latest` is a release, anything else is not, so re-running
# is idempotent. The token is read from KMS at run time (NPM_TOKEN at the org
# root, env prod), the same machine identity every other workflow here uses.
name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: [linux-amd64]
    steps:
      - uses: actions/checkout@v4

      - name: Which packages are ahead of npm?
        id: ahead
        run: |
          set -euo pipefail
          ahead=""
          # The order is the dependency order: glass & mod before the app.
          for dir in pkg/glass pkg/mod pkg/app; do
            [ -f "$dir/package.json" ] || continue
            NAME=$(jq -r .name "$dir/package.json")
            NEW=$(jq -r .version "$dir/package.json")
            # The version itself first: the full packument lags a fresh publish by
            # minutes (it 404s), and reading that as "never published" re-publishes
            # into a 403. The abbreviated document is what installs read.
            if curl -sf -o /dev/null "https://registry.npmjs.org/${NAME}/${NEW}"; then
              echo "$NAME $NEW is already on npm"
              continue
            fi
            OLD=$(curl -sf -H 'Accept: application/vnd.npm.install-v1+json' "https://registry.npmjs.org/${NAME}" | jq -r '."dist-tags".latest // "0.0.0"' || echo 0.0.0)
            TOP=$(printf '%s\n%s\n' "$OLD" "$NEW" | sort -V | tail -1)
            if [ "$OLD" != "$NEW" ] && [ "$TOP" = "$NEW" ]; then
              echo "$NAME $OLD -> $NEW"
              ahead="$ahead $dir"
            else
              echo "$NAME $NEW is not ahead of npm ($OLD)"
            fi
          done
          echo "dirs=${ahead# }" >> "$GITHUB_OUTPUT"
          if [ -n "$ahead" ]; then echo "release=true" >> "$GITHUB_OUTPUT"; else echo "release=false" >> "$GITHUB_OUTPUT"; fi

      - uses: pnpm/action-setup@v4
        if: steps.ahead.outputs.release == 'true'

      - uses: actions/setup-node@v4
        if: steps.ahead.outputs.release == 'true'
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Test and build the packages
        if: steps.ahead.outputs.release == 'true'
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm lint:design
          pnpm test
          pnpm build
          # Each package's root names what a host passes and must load in plain
          # Node: a page's unit specs and tools read it there, with no bundler.
          for dir in pkg/*/; do
            test -s "${dir}dist/index.js"
            test -s "${dir}dist/index.d.ts"
            (cd "$dir" && node --input-type=module -e "await import('./dist/index.js')")
          done

      - name: Read the npm token from KMS
        if: steps.ahead.outputs.release == 'true'
        id: npm
        env:
          KMS_CLIENT_ID: ${{ secrets.KMS_CLIENT_ID }}
          KMS_CLIENT_SECRET: ${{ secrets.KMS_CLIENT_SECRET }}
          KMS_ENDPOINT: ${{ vars.KMS_ENDPOINT || 'https://kms.hanzo.ai' }}
          KMS_SECRET_ENV: ${{ vars.KMS_SECRET_ENV || 'prod' }}
        run: |
          set -uo pipefail
          body="{\"clientId\":\"${KMS_CLIENT_ID}\",\"clientSecret\":\"${KMS_CLIENT_SECRET}\"}"
          out=$(curl -sS -w '\n%{http_code}' "${KMS_ENDPOINT}/v1/kms/auth/login" -H 'Content-Type: application/json' --data-binary "$body")
          code=${out##*$'\n'}; resp=${out%$'\n'*}
          [ "$code" = "200" ] || { echo "::error::KMS login answered HTTP $code"; exit 1; }
          token=$(printf '%s' "$resp" | jq -r '.accessToken // empty')
          [ -n "$token" ] || { echo "::error::KMS login carried no accessToken"; exit 1; }
          for attempt in 1 2 3 4 5; do
            out=$(curl -sS -w '\n%{http_code}' "${KMS_ENDPOINT}/v1/kms/secrets/NPM_TOKEN?env=${KMS_SECRET_ENV}" -H "Authorization: Bearer ${token}")
            code=${out##*$'\n'}; resp=${out%$'\n'*}
            case "$code" in 200) break ;; 5*) sleep 15 ;; *) break ;; esac
          done
          [ "$code" = "200" ] || { echo "::error::KMS secret read answered HTTP $code"; exit 1; }
          npm_token=$(printf '%s' "$resp" | jq -r '.value // empty')
          [ -n "$npm_token" ] || { echo "::error::No NPM_TOKEN in KMS"; exit 1; }
          echo "::add-mask::${npm_token}"
          echo "token=${npm_token}" >> "$GITHUB_OUTPUT"

      - name: Publish
        if: steps.ahead.outputs.release == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ steps.npm.outputs.token }}
          DIRS: ${{ steps.ahead.outputs.dirs }}
        run: |
          set -euo pipefail
          for dir in $DIRS; do
            (cd "$dir" && pnpm publish --access public --no-git-checks)
          done
