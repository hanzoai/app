# The packages this repository publishes, each from its own directory.
packages:
  - pkg/*

# What may run its own install script, asked once.
allowBuilds:
  esbuild: true
  sharp: set this to true or false

# One gui runtime in the tree, whatever asked for it. Two copies are two config
# singletons, and a component rendered under one looks for the other.
overrides:
  '@hanzo/font': 1.11.0
  '@hanzo/gui': 8.3.5
  '@hanzogui/animations-css': 8.3.5
  '@hanzogui/config': 8.3.5
  '@hanzogui/core': 8.3.5
  '@hanzogui/lucide-icons-2': 8.3.5
  '@hanzogui/next-theme': 8.3.5
  '@hanzogui/telemetry': 8.3.5
  '@hanzogui/toast': 8.3.5
  '@hanzogui/web': 8.3.5
  '@react-native/normalize-colors': 0.87.1
  react-is: 19.2.8

# @hanzo/ui 8.33.6 plus the link, research-model, usage-meter and limits fixes
# hanzo-inc/app carries too, until a ui release has them. The product header
# (BusinessHeader, BUSINESS_APPS) is ui's own since 8.31.0, so it left the patch.
patchedDependencies:
  '@hanzo/ui@8.33.6': patches/@hanzo__ui@8.33.6.patch

# Our own release train publishes hours before it is consumed.
minimumReleaseAge: 0

